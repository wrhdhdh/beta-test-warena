<title>W.ARENA</title>
<style>:root{--bg:#08080a;--card:#131316;--line:#2e1316;--tx:#f2f2f2;--mu:#948a8c;--ac:#e11d2e;--ok:#2ecc71;--bad:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#4a0a10 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2c0509 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1,h2,h3{margin:0}.logo{font-weight:900;letter-spacing:1px}.logo b{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:5px 0 10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;font-size:15px}
button{background:linear-gradient(135deg,#e11d2e,#ff4d5a);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}button.big{width:100%;padding:15px;font-size:17px}
button:disabled{opacity:.5}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0}nav button{background:var(--card);color:var(--mu);border:1px solid var(--line);white-space:nowrap}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.lvl{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:3px solid var(--c);font-weight:800;font-size:14px;flex:none}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.st{background:var(--bg);border-radius:8px;padding:10px;text-align:center}.st b{display:block;font-size:20px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}.p span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mu);font-size:12px}
.w{color:var(--ok)}.l{color:var(--bad)}.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.err{color:var(--bad);font-size:13px;min-height:18px}.ov{overflow-x:auto}

#sk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.card{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--ac);box-shadow:0 6px 30px -10px var(--ac)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{text-shadow:0 0 6px #e11d2e66}50%{text-shadow:0 0 22px #e11d2e,0 0 40px #ff4d5a55}}
@keyframes ring{0%{box-shadow:0 0 0 0 #e11d2e88}100%{box-shadow:0 0 0 28px #e11d2e00}}
@keyframes sh{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

#v>*:nth-child(2){animation-delay:.08s}#v>*:nth-child(3){animation-delay:.16s}
.logo{animation:glow 3.5s ease-in-out infinite}
button{position:relative;overflow:hidden;transition:transform .15s,filter .2s}
button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}button:active{transform:scale(.97)}
button.big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff5 50%,transparent 70%);animation:sh 2.6s infinite}
button.g::after{display:none}
.lvl{box-shadow:0 0 10px var(--c);transition:transform .3s}.lvl:hover{transform:rotate(360deg) scale(1.15)}
.bar i{transition:width .8s cubic-bezier(.2,.7,.2,1);background:linear-gradient(90deg,#e11d2e,#ff6b6b)}
.st{transition:transform .2s}.st:hover{transform:translateY(-4px)}
.grid .st:nth-child(2){animation-delay:.07s}.grid .st:nth-child(3){animation-delay:.14s}.grid .st:nth-child(4){animation-delay:.21s}.grid .st:nth-child(5){animation-delay:.28s}
tr{transition:background .2s}tr:hover td{background:#e11d2e14}

h1[style*="48px"]{animation:glow 1s infinite}
.p{}.p:nth-child(3){animation-delay:.08s}.p:nth-child(4){animation-delay:.16s}.p:nth-child(5){animation-delay:.24s}.p:nth-child(6){animation-delay:.32s}
.card:has(h1[style*="48px"]) .bar{animation:ring 1.4s infinite}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #e11d2e33}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#sk{display:none}}

.wrap{padding-bottom:120px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(560px,calc(100% - 24px));margin:0;padding:7px;gap:2px;justify-content:space-between;overflow:visible;z-index:50;border-radius:44px;
background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(14,8,10,.55);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18),0 0 30px -8px #e11d2e66}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;background:transparent;border:0;border-radius:34px;color:#fff;font-size:12px;font-weight:700;transition:background .3s,color .3s,transform .2s}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
nav button.on{background:radial-gradient(120% 120% at 50% 0,rgba(225,29,46,.38),rgba(225,29,46,.12));color:#ff4d5a;box-shadow:inset 0 0 0 1px rgba(255,77,90,.25),0 0 18px -4px #e11d2e}
nav button.on svg{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 6px #e11d2e)}
nav button:hover:not(.on){background:rgba(255,255,255,.07)}

.hero{padding:24px;background:radial-gradient(500px 220px at 90% 0,rgba(225,29,46,.3),transparent 70%),color-mix(in srgb,var(--card) 82%,transparent)}
.hh{font-size:clamp(26px,6vw,44px);line-height:1.1;margin:8px 0 12px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:99;background:rgba(20,10,12,.9);border:1px solid var(--ac);padding:11px 18px;border-radius:30px;font-weight:700;box-shadow:0 8px 30px #e11d2e55;animation:up .35s both}
nav button{font-size:11.5px;padding:9px 2px 8px}nav button svg{width:24px;height:24px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--ac);vertical-align:middle;flex:none}
.tg{color:#ffc400;text-shadow:0 0 8px #ff9a0099;font-style:italic;margin-right:4px}
.tgi{height:18px;vertical-align:middle;margin-right:5px}
.md{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px;backdrop-filter:blur(6px)}.md .card{max-width:380px;width:100%}

body{-webkit-tap-highlight-color:transparent;min-height:100dvh;overscroll-behavior-y:none;touch-action:manipulation}
input,select,textarea{font-size:16px}
textarea{width:100%;padding:11px;margin:5px 0 10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;font-family:inherit;resize:vertical}
textarea:focus{outline:0;border-color:var(--ac)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.lg{height:30px;animation:lgp 3.5s ease-in-out infinite}
@keyframes lgp{0%,100%{filter:drop-shadow(0 0 3px #e11d2e)}50%{filter:drop-shadow(0 0 12px #ff3b4a)}}
.bn,.hh,h2{font-family:'Unbounded','Segoe UI',system-ui,sans-serif}
.bn{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap}.bn b{color:var(--ac)}
h2{font-size:18px;font-weight:700}
span.av{display:inline-grid;place-items:center;background:linear-gradient(135deg,#e11d2e,#5a0a12);color:#fff;font-weight:800;border:0}
.av{border-radius:50%;object-fit:cover;flex:none}
.avw{position:relative;cursor:pointer;flex:none;display:block}.avw i{position:absolute;right:-3px;bottom:-3px;background:var(--ac);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-style:normal;font-size:12px;border:2px solid var(--card)}
.or{text-align:center;color:var(--mu);margin:8px 0;font-size:13px}#gb{display:flex;justify-content:center;min-height:44px;margin:12px 0 0}#gb .gb{width:100%;display:flex;gap:10px;justify-content:center;align-items:center}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg);font-size:14px;word-break:break-word}.msg.u{background:rgba(225,29,46,.18);margin-left:22px}.msg.s{margin-right:22px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
details.card p{margin:8px 0 0}
.wrap{padding:12px 12px 130px}header{gap:8px}header .row{min-width:0}
nav button{font-size:10.5px;padding:8px 1px 7px}nav button svg{width:22px;height:22px}
@media (max-width:480px){.card{padding:12px;border-radius:14px}.hh{font-size:25px}td,th{padding:7px 3px;font-size:13px}.p{font-size:14px;gap:6px}.teams{gap:6px}.bn{font-size:15px}.lg{height:26px}h2{font-size:16px}.hero .row{flex-wrap:wrap}.hero .row button{flex:1}}
@media (min-width:420px){nav button{font-size:11.5px}}

.promo{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:14px;cursor:pointer;border:1px solid var(--ac);background:linear-gradient(100deg,rgba(225,29,46,.3),rgba(20,8,10,.6));position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffff22 50%,transparent 65%);animation:sh 3.2s infinite}
.pdm{width:38px;flex:none;filter:drop-shadow(0 0 8px #3aa0ff)}.ch{font-size:26px;color:var(--ac)}
.poster{position:relative;overflow:hidden;border-radius:20px;padding:26px 18px 24px;min-height:310px;margin-bottom:12px;border:1px solid var(--ac);background:radial-gradient(120% 90% at 80% 0,#8a1220 0,#2a070c 50%,#060607 100%);box-shadow:0 0 50px -12px #e11d2e}

.dm{position:absolute;filter:drop-shadow(0 0 20px #3aa0ff);animation:fl 5s ease-in-out infinite;z-index:1}
.d1{width:44%;max-width:190px;right:-4%;top:14%}.d2{width:21%;right:30%;bottom:6%;animation-delay:-1.6s}.d3{width:15%;right:6%;bottom:5%;animation-delay:-3s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
.tw{position:absolute;color:#fff;z-index:1;animation:tw 2.4s ease-in-out infinite}.t1{left:8%;top:10%}.t2{right:46%;top:40%;animation-delay:.8s;font-size:12px}.t3{right:10%;top:6%;animation-delay:1.5s;font-size:18px}

/* --- плавность --- */
html{scroll-behavior:smooth}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;transform:translateZ(0);background:radial-gradient(1200px 600px at 20% -10%,#4a0a10 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2c0509 0,transparent 55%)}
.card{backdrop-filter:none;-webkit-backdrop-filter:none}
.lg{animation:none;filter:drop-shadow(0 0 6px #e11d2e)}.logo{animation:none}
h1[style*="48px"]{animation:none}.card:has(h1[style*="48px"]) .bar{animation:none}
nav{backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
@keyframes vin{from{opacity:0;transform:translate3d(0,16px,0) scale(.985)}to{opacity:1;transform:none}}
.enter>*{animation:vin .55s cubic-bezier(.22,.8,.24,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.promo::after,.poster::after,button.big::after,.dm,.tw{will-change:transform}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:34px;pointer-events:none;
background:radial-gradient(120% 120% at 50% 0,rgba(225,29,46,.38),rgba(225,29,46,.12));box-shadow:inset 0 0 0 1px rgba(255,77,90,.25),0 0 18px -4px #e11d2e;
transform:translateX(calc(var(--i)*100%));opacity:var(--o);transition:transform .55s cubic-bezier(.3,1.2,.5,1),opacity .3s}
nav button{position:relative;z-index:1;min-width:0;transition:color .3s}
nav button.on{background:none!important;box-shadow:none!important}
nav button svg{transition:transform .45s cubic-bezier(.3,1.4,.5,1),filter .3s}
.bar i{transition:width .9s cubic-bezier(.22,.8,.24,1)}
@media (hover:none){nav button:hover:not(.on){background:none}button:hover:not(:disabled){transform:none;filter:none}.st:hover{transform:none}.lvl:hover{transform:none}.card:hover{box-shadow:none;border-color:var(--line)}tr:hover td{background:none}}

/* --- темы, рамки, значки, чипы --- */
button{background:linear-gradient(135deg,var(--ac),var(--ac2,var(--ac)))}button.g{background:transparent}
.bar i{background:linear-gradient(90deg,var(--ac),var(--ac2,var(--ac)))}
.lg{filter:drop-shadow(0 0 6px var(--ac))}
body::before{background:radial-gradient(1200px 600px at 20% -10%,color-mix(in srgb,var(--ac) 28%,#000) 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,color-mix(in srgb,var(--ac) 16%,#000) 0,transparent 55%)}
nav .ind{background:radial-gradient(120% 120% at 50% 0,color-mix(in srgb,var(--ac) 38%,transparent),color-mix(in srgb,var(--ac) 12%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 0 18px -4px var(--ac)}
nav button.on{color:var(--ac2,var(--ac))}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;box-shadow:0 0 12px var(--ac)}
.fm-gold{box-shadow:0 0 0 2px #f5b301,0 0 12px #f5b301}.fm-neon{box-shadow:0 0 0 2px #3cf0ff,0 0 14px #3cf0ff}
.fm-fire{box-shadow:0 0 0 2px #ff6a00,0 0 12px #ff3b00;animation:fire 1.6s ease-in-out infinite alternate}
@keyframes fire{from{box-shadow:0 0 0 2px #ff6a00,0 0 7px #ff3b00}to{box-shadow:0 0 0 2px #ffb000,0 0 15px #ff3b00}}
.bd{display:inline-block;margin-right:4px}
.bd-flame{animation:flick 1.3s ease-in-out infinite}.bd-bolt{animation:zap 1.8s ease-in-out infinite}.bd-crown{animation:bob 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
@keyframes zap{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 11px;font-size:13px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:20px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bell{position:relative;font-size:20px;cursor:pointer;padding:4px;line-height:1}
.bell i{position:absolute;top:-3px;right:-5px;background:var(--ac);color:#fff;font-style:normal;font-size:11px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.toast{width:max-content;max-width:88vw;text-align:center;white-space:normal}

/* --- оформление --- */

/* ===== красивый поиск матча ===== */
.pl-hero{text-align:center}.pl-ic{width:84px;height:84px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;color:var(--ac);background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%);animation:plIc 3s ease-in-out infinite}
@keyframes plIc{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(8deg)}}
.pl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pl-stats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 4px}
.pl-stats b{display:block;font:800 20px 'Unbounded',system-ui,sans-serif}.pl-stats span{font-size:12px;color:var(--mu)}
.cta{position:relative;font-size:18px;letter-spacing:.5px}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--ac);animation:ctaR 2s ease-out infinite;pointer-events:none}
@keyframes ctaR{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.12,1.5);opacity:0}}
.radar{position:relative;width:210px;height:210px;margin:10px auto 16px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%);border:1px solid rgba(255,255,255,.12)}
.radar::before,.radar::after{content:"";position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}.radar::before{inset:28px}.radar::after{inset:58px}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:rad 3s ease-out infinite}
.radar i:nth-child(2){animation-delay:1s}.radar i:nth-child(3){animation-delay:2s}
@keyframes rad{0%{transform:scale(.25);opacity:.8}100%{transform:scale(1);opacity:0}}
.radar .rsw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,color-mix(in srgb,var(--ac) 55%,transparent) 360deg);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc{position:relative;z-index:2;text-align:center;background:rgba(0,0,0,.55);border-radius:50%;width:104px;height:104px;display:grid;place-content:center;border:1px solid rgba(255,255,255,.2)}

.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px;margin:4px 0}

.slot:not(.on){opacity:.22;filter:grayscale(1);transform:scale(.86)}
.slot.on{animation:popin .5s cubic-bezier(.3,1.5,.5,1)}

.found{text-align:center}.found-t{font:800 24px 'Unbounded',system-ui,sans-serif;background:linear-gradient(90deg,var(--ac),#fff,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite}

.tcol.mine{border-color:color-mix(in srgb,var(--ac) 60%,transparent);box-shadow:0 0 24px -8px var(--ac)}
.thead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.pcard{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:12px;min-width:0}
.pcard.me{background:color-mix(in srgb,var(--ac) 20%,transparent)}
.pcard .pn{flex:1;min-width:0}.pcard .n{font-size:13px;font-weight:700}.pcard .mu{font-size:11px}
.pcard .lvl{width:26px;height:26px;font-size:11px;border-width:2px}
.vsb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 13px 'Unbounded',system-ui,sans-serif;background:#000;color:#fff;border:2px solid var(--ac);box-shadow:0 0 22px var(--ac);z-index:2}
.mt{font:800 26px 'Unbounded',system-ui,sans-serif;color:var(--ac)}
.steps2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.s2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;opacity:.55}
.s2.on{opacity:1;background:color-mix(in srgb,var(--ac) 20%,transparent)}
.s2 b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.seg button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--tx);box-shadow:none}
.seg button.on[data-v=w]{background:linear-gradient(135deg,#1e9e55,#2ecc71);color:#fff;border-color:transparent}
.seg button.on[data-v=l]{background:linear-gradient(135deg,#a8221f,#e74c3c);color:#fff;border-color:transparent}
.kda3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kd{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;text-align:center}
.kd input{text-align:center;font-size:22px;font-weight:800;margin:2px 0}.kd label{font-size:11px;color:var(--mu)}
.upl{display:grid;place-items:center;padding:18px 10px;margin:8px 0;border:2px dashed rgba(255,255,255,.28);border-radius:14px;cursor:pointer;text-align:center;font-size:14px;word-break:break-all}
.upl.ok{border-color:var(--ok);color:var(--ok)}
.tli{display:flex;align-items:center;gap:12px;padding:10px 0}
.tli:last-child{animation:vin .4s both}
.tli .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ac);font-weight:800;flex:none}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.cur .dot{animation:pulseDot 1s ease-in-out infinite}
@keyframes pulseDot{50%{transform:scale(1.15)}}
.pcard .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lvl{flex:none}

/* ===== ПРОИЗВОДИТЕЛЬНОСТЬ ===== */
#sk{z-index:5}
/* размытие только у шапки, меню, окон и подсказок — карточки без blur (он почти не виден, но сильно тормозит) */
.card,.st,.chip,.msg,input,select,textarea,button,.promo{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.28)}
html.ui-max .card,html.ui-max.ui-black .card,html.ui-max.ui-light .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px rgba(0,0,0,.38)}
html.ui-max .card{background:var(--gl)}
html.ui-max .md .card{background:rgba(12,12,16,.9)}
html.perf-low *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.perf-low .card,html.perf-low .st,html.perf-low .chip,html.perf-low nav,html.perf-low #hd{box-shadow:none!important}
html.perf-low .promo::after,html.perf-low .poster::after,html.perf-low button.big::after,html.perf-low .cta::before,html.perf-low .radar i,html.perf-low .radar .rsw,html.perf-low .pl-ic,html.perf-low .found-t,html.perf-low .dm,html.perf-low .tw,html.perf-low .bd,html.perf-low .fm-fire,html.perf-low .cf i{animation:none!important}
html.perf-low .enter>*{animation-duration:.2s!important}
html.perf-low nav,html.perf-low #hd{background:rgba(10,10,14,.92)!important}
html.perf-low .md{background:rgba(0,0,0,.72)!important}
html.perf-low.ui-max .card{background:rgba(12,12,16,.82)!important}
</style>

<script>const LV=[0,801,951,1101,1251,1401,1551,1701,1851,2001],COL=['#aaa','#7ccf7c','#7ccf7c','#f1c40f','#f1c40f','#f1c40f','#ff8a00','#ff8a00','#ff5500','#e0262a'];
const ROLES=['Золотая линия','Линия опыта','Мид','Лесник','Роумер'];
const lvl=e=>{let l=1;LV.forEach((v,i)=>{if(e>=v)l=i+1});return l};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=e=>`<span class="lvl" style="--c:${COL[lvl(e)-1]}">${lvl(e)}</span>`;
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem('mlbb_db'))}catch(e){}
 if(!DB||!DB.users){DB={users:{},session:null,bots:[]};
  const a=['Shadow','Alucard','Layla','Gosu','Nana','Zilong','Kagura','Fanny','Miya','Tigreal','Lancelot','Hayabusa','Lunox','Karina','Chou','Gusion'],b=['Pro','TV','xX','KZ','RU','God','King','Wolf','MVP','1337'];
  for(let i=0;i<40;i++)DB.bots.push({nick:a[Math.floor(Math.random()*a.length)]+'_'+b[Math.floor(Math.random()*b.length)]+Math.floor(Math.random()*99),elo:800+Math.floor(Math.random()*1400),bot:1});save()}}
function saveNow(){try{localStorage.setItem('mlbb_db',JSON.stringify(DB))}catch(e){}}
let _sv=0;function save(){clearTimeout(_sv);_sv=setTimeout(saveNow,250)}
addEventListener('pagehide',saveNow);addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
const me=()=>DB.users[DB.session];
const IC={
play:'<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7A4.7 4.7 0 0 0 2 9.7V15a3 3 0 0 0 5.2 2l1.6-1.8h6.4l1.6 1.8A3 3 0 0 0 22 15V9.7A4.7 4.7 0 0 0 17.3 5z"/></svg>',
profile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 18.5c1.6-2.3 3.6-3.3 6.2-3.3s4.6 1 6.2 3.3"/></svg>',
top:'<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
hist:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6.5V12l3.5 2"/></svg>'};

Object.assign(IC,{fr:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.6 3-5.5 6.5-5.5s6 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.2c2.6 0 4.2 1.5 4.6 4.3"/></svg>',ms:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>',shop:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>'});
const tg=u=>bdg(u)+(u.tag?`<img class="tgi" src="${TAGS}" alt="2UC">`:'');
const MS=[{id:'play',t:'Сыграть 3 матча',n:3,r:50},{id:'win',t:'Выиграть 2 матча',n:2,r:80},{id:'kill',t:'Набрать 15 убийств',n:15,r:60}];
const SH=[{id:'c1',t:'Алый ник',c:'#ff3b4a',p:150},{id:'c2',t:'Золотой ник',c:'#ffd24a',p:300},{id:'c3',t:'Сакура-ник',c:'#ff9ec0',p:400},{id:'c4',t:'Неоновый ник',c:'#3cf0ff',p:500},{id:'tag',t:'Клан-тег 2UC',k:'tag',p:200}];
function norm(u){u.coins=u.coins||0;u.fr=u.fr||[];u.inv=u.inv||[];const d=new Date().toDateString();if(!u.ms||u.ms.d!=d)u.ms={d,p:{},c:[]}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function finish(){const win=$('rs').value=='w',k=Math.max(0,+$('k').value||0),d=Math.max(0,+$('d').value||0),a=Math.max(0,+$('a').value||0);
 if($('mn').value.trim()!=m.no)return $('fe').textContent='Укажите верный № матча: '+m.no;
 if(!$('sf').files.length)return $('fe').textContent='Прикрепите финальный скриншот';
 const st=['Заявка отправлена','Result Pending — в очереди обработки','Платформа сверяет участника матча','Результат подтверждён'];let i=0;
 $('v').innerHTML=`<div class="card"><h2>Матч №${m.no}</h2><div id="pl"></div></div>`;
 const t=setInterval(()=>{$('pl').innerHTML=st.slice(0,i+1).map((x,j)=>{const ok=j<i||i==3;return `<div class="p"><span class="lvl" style="--c:${ok?'#2ecc71':'#e11d2e'}">${ok?'✓':'…'}</span><span>${x}</span></div>`}).join('');if(i++==3){clearInterval(t);setTimeout(()=>commit(win,k,d,a),700)}},900)}
function msV(){const u=me();$('v').innerHTML=`<div class="card row sp"><div><h2>Ежедневные миссии</h2><div class="mu">Обновляются каждый день</div></div><b>🪙 ${u.coins}</b></div>`+MS.map(q=>{const p=Math.min(q.n,u.ms.p[q.id]||0),dn=p>=q.n,cl=u.ms.c.includes(q.id);return `<div class="card"><div class="row sp"><b>${q.t}</b><span class="mu">+${q.r} 🪙</span></div><div class="bar" style="margin:8px 0"><i style="width:${p/q.n*100}%"></i></div><div class="row sp"><span class="mu">${p}/${q.n}</span><button ${dn&&!cl?'':'disabled'} onclick="claim('${q.id}')">${cl?'Получено':'Забрать'}</button></div></div>`}).join('')}
function claim(id){const u=me(),q=MS.find(x=>x.id==id);if((u.ms.p[id]||0)<q.n||u.ms.c.includes(id))return;u.ms.c.push(id);u.coins+=q.r;save();app();toast('+'+q.r+' 🪙')}
function shopV(){const u=me();$('v').innerHTML=`<div class="card row sp"><div><h2>Магазин</h2><div class="mu">Токены за матчи и миссии</div></div><b>🪙 ${u.coins}</b></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">`+SH.map(i=>{const has=u.inv.includes(i.id),on=i.k=='tag'?u.tag:u.eq==i.c;
 const pv=i.k=='tag'?`<img class="tgi" style="height:30px" src="${TAGS}" alt="2UC">`:`<b style="color:${i.c};font-size:18px">${esc(u.nick)}</b>`;
 const lb=i.k?(on?'Снять':has?'Надеть':i.p+' 🪙'):(on?'Надето':has?'Надеть':i.p+' 🪙');
 return `<div class="card" style="text-align:center"><div style="height:50px;display:grid;place-items:center">${pv}</div><div class="mu">${i.t}</div><br><button ${!i.k&&on?'disabled':''} onclick="buy('${i.id}')">${lb}</button></div>`}).join('')+'</div>'}
function buy(id){const u=me(),i=SH.find(x=>x.id==id);if(!u.inv.includes(id)){if(u.coins<i.p)return toast('Не хватает монет');u.coins-=i.p;u.inv.push(id);toast('Куплено: '+i.t)}else if(i.k&&u[i.k]){u[i.k]=0;save();return app()}
 if(i.k=='tag')u.tag=1;else u.eq=i.c;save();app()}
function findP(n){n=n.trim().toLowerCase();const u=DB.users[n];if(u)return{nick:u.nick,elo:u.elo};const b=DB.bots.find(b=>b.nick.toLowerCase()==n);return b&&{nick:b.nick,elo:b.elo}}
function frV(){const u=me();$('v').innerHTML=`<div class="card"><h2>Друзья</h2><div class="row" style="margin-top:8px"><input id="fn" placeholder="Никнейм игрока" style="margin:0"><button onclick="addF()">Добавить</button></div><div class="err" id="fe2"></div></div><div class="card">${u.fr.length?u.fr.map(n=>{const f=findP(n)||{nick:n,elo:1000},on=hash(f.nick)%3!=0;return `<div class="p">${badge(f.elo)}<div style="flex:1;min-width:0"><div class="n">${esc(f.nick)}${vf(f.nick)}</div><div class="mu"><span style="color:${on?'var(--ok)':'var(--mu)'}">●</span> ${on?'в сети':'не в сети'} · ELO ${f.elo}</div></div><button class="g" ${on?'':'disabled'} data-n="${esc(f.nick)}" onclick="toast('Приглашение отправлено: '+this.dataset.n)">Позвать</button><button class="g" data-n="${esc(f.nick)}" onclick="delF(this.dataset.n)">✕</button></div>`}).join(''):'<p class="mu">Список друзей пуст. Добавьте игрока по нику, например из таблицы лидеров.</p>'}</div>`}
function addF(){const f=findP($('fn').value),u=me(),e=t=>$('fe2').textContent=t;if(!f)return e('Игрок не найден');if(f.nick==u.nick)return e('Это вы');if(u.fr.includes(f.nick))return e('Уже в друзьях');u.fr.push(f.nick);save();frV()}
function delF(n){const u=me();u.fr=u.fr.filter(x=>x!=n);save();frV()}
function landing(){const us=Object.values(DB.users),mt=us.reduce((a,u)=>a+u.w+u.l,0),top=DB.bots.concat(us).sort((a,b)=>b.elo-a.elo).slice(0,5);

 return `<h3 style="margin:18px 2px 4px">Недельные задания</h3><div class="mu" style="margin:0 2px 8px">Обновляются каждую неделю</div>`+WM.map(q=>{const p=wkProg(u,q),dn=p>=q.n,cl=u.wk.c.includes(q.id);return `<div class="card"><div class="row sp"><b>${q.t}</b><span class="mu">+${q.r} 🪙</span></div><div class="bar" style="margin:8px 0"><i style="width:${p/q.n*100}%"></i></div><div class="row sp"><span class="mu">${p}/${q.n}</span><button ${dn&&!cl?'':'disabled'} onclick="claimW('${q.id}')">${cl?'Получено':'Забрать'}</button></div></div>`}).join('')}
function claimW(id){const u=me(),q=WM.find(x=>x.id==id);if(!u.wk||wkProg(u,q)<q.n||u.wk.c.includes(id))return;u.wk.c.push(id);u.coins+=q.r;note('Миссия выполнена: +'+q.r+' токенов');save();toast('+'+q.r+' 🪙');app()}
const _msV=msV;msV=function(){_msV();$('v').insertAdjacentHTML('beforeend',weeklyHTML())};
/* промокоды */

 u.pc.push(c);u.coins+=PROMOS[c];note('Промокод активирован: +'+PROMOS[c]+' токенов');save();toast('+'+PROMOS[c]+' 🪙');app()}
const _shV=shopV;shopV=function(){_shV();$('v').firstElementChild.insertAdjacentHTML('afterend',`<div class="card"><h3>Промокод</h3><div class="row" style="margin-top:8px"><input id="pcd" placeholder="Введите код" style="margin:0;text-transform:uppercase"><button onclick="useCode()">Активировать</button></div><div class="err" id="pce"></div></div>`)};

/* ===== статистика и награды за достижения ===== */
const AR=[50,100,100,150,150,100,200,500];
function eloBars(a){if(!a.length)return '<p class="mu">Сыграйте матчи, и здесь появятся графики.</p>';const mx=Math.max(5,...a.map(h=>Math.abs(h.delta))),w=300/Math.max(a.length,10);
 return `<svg viewBox="0 0 300 100" style="width:100%;height:110px"><line x1="0" y1="50" x2="300" y2="50" stroke="var(--line)" stroke-width="1"/>${a.map((h,i)=>{const hh=Math.abs(h.delta)/mx*46;return `<rect x="${(i*w+w*.15).toFixed(1)}" y="${h.delta>=0?(50-hh).toFixed(1):50}" width="${(w*.7).toFixed(1)}" height="${Math.max(1,hh).toFixed(1)}" rx="2" fill="${h.delta>=0?'var(--ok)':'var(--bad)'}"/>`}).join('')}</svg>`}
function claimA(i){const u=me();u.ac=u.ac||[];if(!ACH[i][2](u)||u.ac.includes(i))return;u.ac.push(i);u.coins+=AR[i];note('Награда за достижение: +'+AR[i]+' токенов');save();toast('+'+AR[i]+' 🪙');statV()}
function statV(){const u=me(),h=u.hist,g=u.w+u.l;u.ac=u.ac||[];
 const kda=((u.k+u.a)/Math.max(1,u.d)).toFixed(2),peak=Math.max(1000,...h.map(x=>x.elo)),avg=h.length?(h.reduce((a,x)=>a+x.delta,0)/h.length).toFixed(1):'0',
 days=[...Array(28)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-27+i);const t=d.getTime();return h.filter(x=>x.ts>=t&&x.ts<t+864e5).length}),mx=Math.max(1,...days);
 const roles=ROLES.map(r=>{const a=h.filter(x=>x.role==r);return a.length?`<div style="margin:8px 0"><div class="row sp"><span>${r}</span><span class="mu">${Math.round(a.filter(x=>x.win).length/a.length*100)}% · ${a.length}</span></div><div class="bar"><i style="width:${Math.round(a.filter(x=>x.win).length/a.length*100)}%"></i></div></div>`:''}).join('');
 $('v').innerHTML=`<div class="card"><h2>Статистика</h2></div>
 <div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="st"><b>${g}</b>Матчи</div><div class="st"><b>${g?Math.round(u.w/g*100):0}%</b>Винрейт</div><div class="st"><b>${kda}</b>KDA</div><div class="st"><b>${bestStreak(u)}</b>Лучшая серия</div><div class="st"><b>${peak}</b>Пик ELO</div><div class="st"><b>${avg}</b>Среднее изменение ELO</div></div>
 <div class="card" style="margin-top:12px"><h3>Изменение ELO (последние 20 матчей)</h3>${eloBars(h.slice(0,20).reverse())}</div>
 <div class="card"><h3>Активность за 28 дней</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px">${days.map(n=>`<div style="aspect-ratio:1;border-radius:6px;background:${n?`color-mix(in srgb,var(--ac) ${Math.round(25+75*n/mx)}%,transparent)`:'rgba(255,255,255,.06)'}"></div>`).join('')}</div></div>
 <div class="card"><h3>Винрейт по ролям</h3>${roles||'<p class="mu">Сыграйте матчи, и здесь появятся графики.</p>'}</div>
 <div class="card"><h3>Награды за достижения</h3>${ACH.map((a,i)=>{const ok=a[2](u),got=u.ac.includes(i);return `<div class="p"><span style="font-size:22px">${a[0]}</span><span style="flex:1;${ok?'':'opacity:.5'}">${a[1]}</span><button ${ok&&!got?'':'disabled'} onclick="claimA(${i})">${got?'Получено':'+'+AR[i]+' 🪙'}</button></div>`}).join('')}</div>`}
const _hv4=homeV;homeV=function(){_hv4();$('v').insertAdjacentHTML('beforeend','<div class="card row sp"><div><b>Статистика</b><div class="mu">Графики, активность, награды</div></div><button class="g" onclick="tab=\'stat\';app()">Открыть</button></div>')};

/* ===== колесо удачи ===== */
const WP=[{l:'20',v:20,w:30},{l:'50',v:50,w:25},{l:'75',v:75,w:15},{l:'100',v:100,w:12},{l:'150',v:150,w:8},{l:'250',v:250,w:5},{l:'500',v:500,w:3},{l:'🎁',v:0,w:2}];
let ROT=0,SPINNING=0;
const todayS=()=>new Date().toDateString(),canFree=u=>!u.sp||u.sp.d!=todayS();
const arc=i=>{const R=140,a=k=>(k*45-90)*Math.PI/180,pt=k=>(150+R*Math.cos(a(k))).toFixed(1)+' '+(150+R*Math.sin(a(k))).toFixed(1);return `M150 150L${pt(i)}A${R} ${R} 0 0 1 ${pt(i+1)}Z`};
function wheelSVG(){return `<svg viewBox="0 -24 300 324" style="width:100%;max-width:330px;margin:8px auto;display:block;overflow:visible"><g id="wg" style="transform-origin:150px 150px;transition:transform 4.6s cubic-bezier(.12,.75,.15,1);transform:rotate(${ROT}deg)">${WP.map((p,i)=>{const c=(i*45+22.5-90)*Math.PI/180,x=150+96*Math.cos(c),y=150+96*Math.sin(c);return `<path d="${arc(i)}" fill="${i==7?'#f5b301':i%2?'#2a2d33':'var(--ac)'}" stroke="#000" stroke-opacity=".35"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="#fff" font-size="${i==7?26:24}" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i*45+22.5} ${x.toFixed(1)} ${y.toFixed(1)})">${p.l}</text>`}).join('')}</g><circle cx="150" cy="150" r="24" fill="#0a0a0c" stroke="#fff" stroke-opacity=".4" stroke-width="3"/><circle cx="150" cy="150" r="140" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="4"/><path d="M136 -20L164 -20L150 16Z" fill="#fff" style="filter:drop-shadow(0 2px 4px #000a)"/></svg>`}
function wheelV(){const u=me(),f=canFree(u);
 $('v').innerHTML=`<div class="card" style="text-align:center"><h2>Колесо удачи</h2><div class="mu" id="wsub">${f?'Бесплатное вращение доступно!':'Приходите завтра за бесплатным вращением'}</div>${wheelSVG()}<button class="big" id="spb" onclick="spin()">${f?'Крутить бесплатно':'Крутить за 100 🪙'}</button><div style="margin-top:10px;min-height:24px;font-weight:700" id="spr"></div></div>
 <div class="card"><h3>Призы</h3><div class="chips">${WP.map(p=>`<span class="chip on">${p.v?p.v+' 🪙':'🎁 Джекпот'}</span>`).join('')}</div><p class="mu">Джекпот: случайный редкий предмет из магазина. Дополнительное вращение стоит 100 токенов.</p></div>`}
function spin(){if(SPINNING)return;const u=me(),f=canFree(u);if(!f&&u.coins<100)return toast('Не хватает монет');SPINNING=1;if(f)u.sp={d:todayS()};else u.coins-=100;save();hdUpd();
 let r=Math.random()*100,idx=0;for(let i=0;i<WP.length;i++){r-=WP[i].w;if(r<0){idx=i;break}}
 const center=idx*45+22.5+(Math.random()*24-12),cur=ROT%360;ROT+=360*5+(((360-center)-cur)%360+360)%360;
 const g=$('wg');if(g)g.style.transform=`rotate(${ROT}deg)`;audio();$('spr')&&($('spr').textContent='');
 setTimeout(()=>{SPINNING=0;grantW(idx)},UI.an?4700:50)}
function grantW(idx){const u=me(),p=WP[idx];let msg;
 if(p.v){u.coins+=p.v;msg='Выигрыш: +'+p.v+' токенов'}
 else{const left=RARE.filter(x=>!u.inv.includes(x.id));if(left.length){const it=left[Math.floor(Math.random()*left.length)];u.inv.push(it.id);msg='Джекпот! Вы выиграли: '+it.t}else{u.coins+=300;msg='Джекпот! +300 токенов'}}
 save();note('Колесо удачи: '+msg);hdUpd();confetti(p.v?28:60);ding();
 const r=$('spr');if(r){r.textContent=msg;r.style.color='var(--ac2,var(--ac))'}const b=$('spb');if(b)b.textContent='Крутить за 100 🪙';const sb=$('wsub');if(sb)sb.textContent='Приходите завтра за бесплатным вращением'}
function confetti(n){const w=document.createElement('div');w.className='cf';const cols=['#e11d2e','#f5b301','#3cf0ff','#a855f7','#ffffff'];
 for(let i=0;i<n;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${(Math.random()*.5).toFixed(2)}s;--dx:${Math.round((Math.random()-.5)*160)}px;--r:${Math.round(Math.random()*720)}deg`;w.appendChild(e)}
 document.body.appendChild(w);setTimeout(()=>w.remove(),3400)}
const _hv5=homeV;homeV=function(){_hv5();const u=me(),f=canFree(u);$('v').firstElementChild.insertAdjacentHTML('afterend',`<div class="card row sp" style="cursor:pointer" onclick="tab='wheel';app()"><div><b>🎡 Колесо удачи</b><div class="mu">${f?'Бесплатное вращение доступно!':'Приходите завтра за бесплатным вращением'}</div></div>${f?'<span class="lvl" style="--c:var(--ac)">!</span>':''}</div>`)};

/* ===== красивый поиск матча ===== */
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function pickRole(b){$('mr').value=b.dataset.r;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))}
function playV(){const u=me(),v=$('v');
 if(m&&m.stage=='queue')return queueV();if(m&&m.stage=='lobby')return lobbyV();if(m&&m.stage=='live')return liveV();
 const l=lvl(u.elo),pr=l<10?Math.min(100,(u.elo-LV[l-1])/(LV[l]-LV[l-1])*100):100,g=u.w+u.l;
 v.innerHTML=promo()+`<div class="card pl-hero"><div class="pl-ic"><svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M32 4v14M32 46v14M4 32h14M46 32h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
 <h2>Ранговый матч 5×5</h2><div class="mu">Подбор игроков с близким ELO</div>
 <div class="pl-stats"><div><b>${u.elo}</b><span>ELO</span></div><div><b>${g?Math.round(u.w/g*100):0}%</b><span>Винрейт</span></div><div><b>${curStreak(u)}</b><span>Серия побед</span></div></div>
 <div class="bar"><i style="width:${pr}%"></i></div><div class="mu" style="margin:6px 0 14px">${l<10?'До следующего уровня: '+(LV[l]-u.elo)+' ELO':'Максимальный уровень'}</div>
 <div class="mu" style="margin-bottom:6px">Выберите роль</div><input type="hidden" id="mr" value="${esc(u.role)}"><div class="chips" style="justify-content:center">${ROLES.map(r=>`<button class="chip ${r==u.role?'on':''}" data-r="${esc(r)}" onclick="pickRole(this)">${r}</button>`).join('')}</div>
 <button class="big cta" style="margin-top:18px" onclick="startQ()">НАЙТИ МАТЧ</button></div>`}
function queueV(){if(tab!='play'||!m||m.stage!='queue')return;const u=me();
 if(!m.pool)m.pool=DB.bots.slice().sort((a,b)=>Math.abs(a.elo-u.elo)-Math.abs(b.elo-u.elo)).slice(0,14).sort(()=>Math.random()-.5).slice(0,9).map(x=>({nick:x.nick,elo:x.elo}));
 if(!$('qc')){const all=[u].concat(m.pool);
  $('v').innerHTML=`<div class="card" style="text-align:center"><div class="mu">Идёт поиск игроков</div><div class="radar"><i></i><i></i><i></i><span class="rsw"></span><div class="rc"><b id="qc">${m.found}/10</b><span>Поиск игроков…</span></div></div>
  <div class="slots" id="qs">${all.map((p,i)=>`<div class="slot ${i<m.found?'on':''}">${av(p,44)}<span class="lvbadge" style="border-color:${COL[lvl(p.elo)-1]}">${lvl(p.elo)}</span></div>`).join('')}</div>
  <div class="bar" style="margin:14px 0 8px"><i id="qb" style="width:0%"></i></div><div class="row sp mu"><span>Ваш ELO ${u.elo}</span><span>Время в очереди: <b id="qt" style="color:var(--tx)">${mmss(m.t)}</b></span></div>
  <button class="g" style="margin-top:14px" onclick="cancelQ()">Отменить</button></div>`;enterV();requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('qb');if(b&&m)b.style.width=m.found*10+'%'}))}
 else{$('qc').textContent=m.found+'/10';$('qb').style.width=m.found*10+'%';$('qt').textContent=mmss(m.t);document.querySelectorAll('#qs .slot').forEach((e,i)=>e.classList.toggle('on',i<m.found))}}
function buildLobby(){const u=me(),pool=(m.pool&&m.pool.length==9?m.pool:DB.bots.slice().sort((a,b)=>Math.abs(a.elo-u.elo)-Math.abs(b.elo-u.elo)).slice(0,14).sort(()=>Math.random()-.5).slice(0,9)).map(x=>({nick:x.nick,elo:x.elo}));
 const all=[{nick:u.nick,elo:u.elo,role:m.role,me:1},...pool].sort(()=>Math.random()-.5);
 all.forEach((p,i)=>p.role=p.role||ROLES[Math.floor(i/2)%5]);
 m={stage:'lobby',A:all.slice(0,5),B:all.slice(5),left:15,no:1000+Math.floor(Math.random()*9000),srv:['Москва','Франкфурт','Сингапур'][Math.floor(Math.random()*3)]};
 const my=m.A.some(p=>p.me)?m.A:m.B;m.mine=my===m.A?'A':'B';
 timer=setInterval(()=>{m.left--;if(m.left<=0){clearInterval(timer);accept()}else lobbyV()},1000);lobbyV()}
const teamCol=(t,mine,label)=>`<div class="tcol ${mine?'mine':''}"><div class="thead"><b>${label}</b><span class="mu">ø${avg(t)}</span></div>${t.map(p=>`<div class="pcard ${p.me?'me':''}">${av(p,36)}<div class="pn"><div class="n">${esc(p.nick)}${vf(p.nick)}</div><div class="mu">${p.role}</div></div>${badge(p.elo)}</div>`).join('')}</div>`;
function lobbyV(){if(tab!='play'||!m||m.stage!='lobby')return;const b=$('lbtn');
 if(b&&b.dataset.no==m.no){b.textContent='ПРИНЯТЬ ('+m.left+')';const r=$('lbar');if(r)r.style.width=m.left/15*100+'%';return}
 $('v').innerHTML=`<div class="card found"><div class="found-t">Матч найден!</div><div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0"><span class="chip on">Матч №${m.no}</span><span class="chip">Сервер: ${m.srv}</span></div>
 <div class="vsgrid">${teamCol(m.A,m.mine=='A','Команда 1')}${teamCol(m.B,m.mine=='B','Команда 2')}<div class="vsb">VS</div></div>
 <button class="big" id="lbtn" data-no="${m.no}" onclick="accept()" style="margin-top:14px">ПРИНЯТЬ (${m.left})</button><div class="bar" style="margin-top:10px"><i id="lbar" style="width:100%;transition:width 1s linear"></i></div></div>`;enterV()}
function pickRes(b){$('rs').value=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}
function upName(i){const t=$('upt'),f=i.files[0];if(t)t.textContent=f?('Файл выбран: '+f.name):'📷 Прикрепить скриншот результата';i.parentNode.classList.toggle('ok',!!f)}
function liveV(){$('v').innerHTML=`<div class="card"><div class="row sp"><div><div class="mu">Матч идёт</div><h2>№${m.no}</h2></div><div style="text-align:right"><div class="mt" id="mt">${mmss(Math.floor((Date.now()-m.start)/1000))}</div><div class="mu">${m.srv}</div></div></div>
 <div class="steps2"><div class="s2 on"><b>1</b><span>Сыграйте матч в MLBB</span></div><div class="s2"><b>2</b><span>Отправьте результат</span></div></div><p class="mu" style="margin:10px 0 0">Создайте кастомную комнату в MLBB, лидеры команд добавляют друг друга по игровым ID. После игры внесите результат.</p></div>
 <div class="vsgrid">${teamCol(m.A,m.mine=='A','Команда 1')}${teamCol(m.B,m.mine=='B','Команда 2')}<div class="vsb">VS</div></div>
 <div class="card"><h3>Результат матча</h3><div class="mu" style="margin-top:8px">Результат вашей команды</div><input type="hidden" id="rs" value="w"><div class="seg"><button class="on" data-v="w" onclick="pickRes(this)">🏆 Победа</button><button data-v="l" onclick="pickRes(this)">💀 Поражение</button></div>
 <div class="kda3"><div class="kd"><span>⚔️</span><input id="k" type="number" min="0" value="0" inputmode="numeric"><label>Убийства</label></div><div class="kd"><span>💀</span><input id="d" type="number" min="0" value="0" inputmode="numeric"><label>Смерти</label></div><div class="kd"><span>🤝</span><input id="a" type="number" min="0" value="0" inputmode="numeric"><label>Помощь</label></div></div>
 <label class="mu">№ матча</label><input id="mn" inputmode="numeric" placeholder="${m.no}">
 <label class="upl" for="sf"><span id="upt">📷 Прикрепить скриншот результата</span><input id="sf" type="file" accept="image/*" hidden onchange="upName(this)"></label>
 <div class="err" id="fe"></div><button class="big" onclick="finish()">Отправить результат</button></div>`;
 clearInterval(window._lt);window._lt=setInterval(()=>{const e=$('mt');if(!e||!m||m.stage!='live'){clearInterval(window._lt);return}e.textContent=mmss(Math.floor((Date.now()-m.start)/1000))},1000)}
function finish(){const win=$('rs').value=='w',k=Math.max(0,+$('k').value||0),d=Math.max(0,+$('d').value||0),a=Math.max(0,+$('a').value||0);
 if($('mn').value.trim()!=m.no)return $('fe').textContent='Укажите верный № матча: '+m.no;
 if(!$('sf').files.length)return $('fe').textContent='Прикрепите финальный скриншот';
 const st=['Заявка отправлена','Result Pending — в очереди обработки','Платформа сверяет участника матча','Результат подтверждён'];let i=0;
 $('v').innerHTML=`<div class="card"><div class="mu">Матч</div><h2>№${m.no}</h2><div id="pl" style="margin-top:8px"></div></div>`;enterV();
 const t=setInterval(()=>{$('pl').innerHTML=st.slice(0,i+1).map((x,j)=>{const ok=j<i||i==3;return `<div class="tli ${ok?'done':'cur'}"><span class="dot">${ok?'✓':'…'}</span><span>${x}</span></div>`}).join('');if(i++==3){clearInterval(t);setTimeout(()=>commit(win,k,d,a),700)}},900)}

/* ===== автоматический экономный режим ===== */
function perfWatch(ms){if(UI.perf!='auto'||PERFLOW)return;let last=0,d=[],t0=0;
 const f=t=>{if(!t0)t0=t;if(last){const dt=t-last;if(dt<1000)d.push(dt)}last=t;
  if(t-t0<ms)requestAnimationFrame(f);
  else if(d.length>8&&d.reduce((a,b)=>a+b,0)/d.length>40){PERFLOW=true;try{localStorage.setItem('wa_pl','1')}catch(e){}applyUI();toast('Включён экономный режим для плавной работы')}};
 requestAnimationFrame(f)}
applyUI();setTimeout(()=>perfWatch(3000),1800);
load();DB.session&&me()?app():landing();

window.__ok=1;
</script>
</body></html>
